<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoltenStar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Google Sans';
            src: local('Google Sans'), local('Product Sans'), sans-serif;
            font-weight: 400;
        }
        @font-face {
            font-family: 'Google Sans';
            src: local('Google Sans Medium'), local('Product Sans Medium'), sans-serif;
            font-weight: 500;
        }

        :root {
            --bg: #18120E;
            --surface: #2D2118;
            --primary: #FFB786;
            --disabled-bg: #3d342f;
            --disabled-text: #7a6e66;
        }

        body {
            font-family: 'Google Sans', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            overflow: hidden;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* --- LOADING SCREEN --- */
        #loader-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .loader-container {
            position: relative;
            width: 220px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wavy-outline {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .wavy-path {
            fill: none;
            stroke: var(--primary);
            stroke-width: 3.5;
            stroke-linecap: round;
            filter: url(#wave-filter);
        }

        .enter-btn {
            position: relative;
            z-index: 10;
            width: 170px;
            height: 52px;
            border-radius: 99px;
            background-color: var(--disabled-bg);
            color: var(--disabled-text);
            font-size: 17px;
            font-weight: 500;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            /* Убрано свечение */
            box-shadow: none;
        }

        .enter-btn.ready {
            background-color: var(--primary);
            color: #2D2118;
            pointer-events: auto;
            transform: scale(1.02);
            /* Убеждаемся, что тени нет и в активном состоянии */
            box-shadow: none;
        }
        
        .enter-btn.ready:active {
            transform: scale(0.96);
        }

        /* --- MAIN SITE --- */
        #main-site {
            display: none;
            opacity: 0;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .scroll-container {
            height: 65vh;
            width: 100%;
            overflow-y: auto;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }

        .scroll-container::-webkit-scrollbar { display: none; }

        .project-btn {
            background-color: var(--surface);
            border-radius: 26px;
            margin: 0 24px 12px 24px;
            display: flex;
            align-items: center;
            padding: 16px 22px;
            text-decoration: none;
            color: inherit;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: rgba(255, 183, 134, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
        }

        .icon-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="loader-container">
            <svg class="wavy-outline" viewBox="0 0 220 80">
                <defs>
                    <filter id="wave-filter" x="-10%" y="-10%" width="120%" height="120%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" result="noise">
                            <animate attributeName="baseFrequency" values="0.03; 0.05; 0.03" dur="2s" repeatCount="indefinite" />
                        </feTurbulence>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
                    </filter>
                </defs>
                <path id="progress-path" class="wavy-path" d="M 110,9 L 174,9 A 31,31 0 0,1 174,71 L 46,71 A 31,31 0 0,1 46,9 Z" />
            </svg>
            <button id="enter-btn" class="enter-btn">Войти</button>
        </div>
    </div>

    <div id="main-site">
        <header class="pt-16 pb-12 flex flex-col items-center">
            <img src="https://raw.githubusercontent.com/MoltenSt4r/img/refs/heads/main/moon.jpg?token=GHSAT0AAAAAAD2Z42KSEZNCBX2OKVM22CEA2QIP7PA" 
                 class="w-24 h-24 rounded-[2.5rem] object-cover mb-4" alt="Logo">
            <h1 class="text-2xl font-medium tracking-wide">MoltenStar</h1>
        </header>

        <div id="scroll-wrapper" class="scroll-container">
            <div id="list-content" class="flex flex-col"></div>
        </div>
    </div>

    <script>
        const projects = [
            { title: "MoltenStar Space", url: "https://moltenstar.space", type: "web" },
            { title: "Doolcoin Space", url: "https://doolcoin.space", type: "web" },
            { title: "GAG Luck Bot", url: "https://t.me/GAG_luck_bot", type: "tg" },
            { title: "Nimrate Bot", url: "https://t.me/Nimratebot", type: "tg" },
            { title: "Limbo Survival", url: "https://t.me/LimboSurvival_bot", type: "tg" },
            { title: "OmegaStar RNG", url: "https://t.me/OmegaStarRNG_bot", type: "tg" },
            { title: "Lords Cards", url: "https://t.me/LordsCards_bot", type: "tg" },
            { title: "TG Link Tool", url: "https://t.me/TGLinkTool_bot", type: "tg" }
        ];

        const path = document.getElementById('progress-path');
        const enterBtn = document.getElementById('enter-btn');
        const wavyOutline = document.querySelector('.wavy-outline');
        const loaderScreen = document.getElementById('loader-screen');
        const mainSite = document.getElementById('main-site');

        function triggerVibe(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        document.body.addEventListener('touchstart', () => triggerVibe(5), { once: true });

        window.addEventListener('load', () => {
            const length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;
            path.getBoundingClientRect();
            path.style.transition = 'stroke-dashoffset 2.5s ease-in-out';
            
            setTimeout(() => {
                path.style.strokeDashoffset = '0';
            }, 100);

            setTimeout(() => {
                wavyOutline.style.opacity = '0';
                enterBtn.classList.add('ready');
                triggerVibe([30, 50]);
            }, 2600);
        });

        enterBtn.addEventListener('click', () => {
            triggerVibe([50, 30, 50]);
            loaderScreen.style.opacity = '0';
            setTimeout(() => {
                loaderScreen.style.display = 'none';
                mainSite.style.display = 'flex';
                requestAnimationFrame(() => {
                    mainSite.style.opacity = '1';
                    initCarousel();
                });
            }, 500);
        });

        const scrollWrapper = document.getElementById('scroll-wrapper');
        const listContent = document.getElementById('list-content');
        
        // Новая иконка Telegram
        const tgIconUrl = "https://www.svgrepo.com/show/388724/telegram.svg";
        const webIcon = `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>`;

        let singleListHeight = 0;
        let lastScrollTop = 0;

        function initCarousel() {
            const btnsHTML = projects.map(p => {
                const icon = p.type === 'tg' 
                    ? `<img src="${tgIconUrl}" class="icon-img" alt="TG" style="filter: invert(82%) sepia(21%) saturate(786%) hue-rotate(334deg) brightness(101%) contrast(101%);">` 
                    : webIcon;
                return `
                <a href="${p.url}" target="_blank" class="project-btn" onclick="triggerVibe(20)">
                    <div class="icon-box">${icon}</div>
                    <span class="text-[17px] font-medium">${p.title}</span>
                </a>
            `}).join('');
            
            listContent.innerHTML = btnsHTML.repeat(8);
            const firstItem = listContent.children[0];
            const itemHeight = firstItem.offsetHeight + 12;
            singleListHeight = itemHeight * projects.length;
            scrollWrapper.scrollTop = singleListHeight * 4;
            lastScrollTop = scrollWrapper.scrollTop;
        }

        scrollWrapper.addEventListener('scroll', () => {
            const top = scrollWrapper.scrollTop;
            if (Math.abs(top - lastScrollTop) > 70) {
                triggerVibe(5);
                lastScrollTop = top;
            }
            if (top < singleListHeight * 2) {
                scrollWrapper.scrollTop = top + singleListHeight;
            } else if (top > singleListHeight * 6) {
                scrollWrapper.scrollTop = top - singleListHeight;
            }
        });
    </script>
</body>
</html>
